<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" href="./icons/favicon_light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="./icons/favicon_dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Holad — быстрый современный музыкальный плеер для Navidrome и Subsonic серверов." />
    <title>Holad</title>
  </head>
  <body style="background-color: transparent; color: #fff;">
    <div id="root">
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }
        .app-shell-pulse {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
      </style>
      <div class="app-shell-pulse" style="min-height:100vh;background:#000000;display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;">
        <div style="height:64px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 24px;gap:16px;">
          <div style="width:36px;height:36px;border-radius:10px;background:#18181b;"></div>
          <div style="width:120px;height:20px;border-radius:6px;background:#18181b;"></div>
        </div>
        <div style="padding:24px;display:flex;flex-direction:column;gap:20px;">
          <div style="width:180px;height:24px;border-radius:6px;background:#18181b;"></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;">
            <div style="aspect-ratio:1;border-radius:12px;background:#121212;"></div>
            <div style="aspect-ratio:1;border-radius:12px;background:#121212;"></div>
            <div style="aspect-ratio:1;border-radius:12px;background:#121212;"></div>
            <div style="aspect-ratio:1;border-radius:12px;background:#121212;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
