name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers workflow on version tags like v1.0.0

env:
  NODE_OPTIONS: "--no-deprecation"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build-web:
    name: Build Web Server and Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Ensure pnpm store exists
        run: |
          mkdir -p $(pnpm store path)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Make script executable
        run: chmod +x build_release.sh

      - name: Run Web build
        run: ./build_release.sh --skip-tauri --skip-android
        
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holad-web-release
          path: artifacts/holad-web-release.tar.gz

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Ensure pnpm store exists
        run: |
          mkdir -p $(pnpm store path)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tauri/src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Make script executable
        run: chmod +x build_release.sh

      - name: Run Linux build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build_release.sh --skip-android --skip-client --skip-server --skip-archive

      - name: Upload Linux AppImage and Update Bundles
        uses: actions/upload-artifact@v4
        with:
          name: holad-linux-appimage
          path: |
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/*.sig
          if-no-files-found: ignore

      - name: Upload Linux Deb
        uses: actions/upload-artifact@v4
        with:
          name: holad-linux-deb
          path: artifacts/*.deb
          if-no-files-found: ignore

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Ensure pnpm store exists
        run: |
          $store = pnpm store path
          New-Item -ItemType Directory -Force -Path $store

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tauri/src-tauri

      - name: Run Windows build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\build_release.bat --skip-android --skip-client --skip-server --skip-archive



      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: holad-windows-setup
          path: artifacts/*setup.exe
          if-no-files-found: ignore

      - name: Upload Windows MSI and Update Bundles
        uses: actions/upload-artifact@v4
        with:
          name: holad-windows-msi
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.sig
          if-no-files-found: ignore

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Ensure pnpm store exists
        run: |
          mkdir -p $(pnpm store path)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make script executable
        run: chmod +x build_release.sh

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > Capacitor/android/app/release-key.keystore

      - name: Run Android build
        env:
          ANDROID_KEYSTORE_FILE: "release-key.keystore"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
             export ANDROID_KEYSTORE_FILE="release-key.keystore"
          else
             unset ANDROID_KEYSTORE_FILE
          fi
          ./build_release.sh --skip-tauri --skip-client --skip-server --skip-archive

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: holad-android-apk
          path: artifacts/*.apk
  create-release:
    name: Create GitHub Release
    needs: [build-web, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: holad-web-release
          merge-multiple: true
        continue-on-error: true

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          pattern: holad-linux-appimage
          merge-multiple: true
        continue-on-error: true

      - name: Download Linux Deb
        uses: actions/download-artifact@v4
        with:
          pattern: holad-linux-deb
          merge-multiple: true
        continue-on-error: true

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          pattern: holad-windows-setup
          merge-multiple: true
        continue-on-error: true

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          pattern: holad-windows-msi
          merge-multiple: true
        continue-on-error: true

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: holad-android-apk
          merge-multiple: true
        continue-on-error: true

      - name: Generate SHA256 Checksums
        run: |
          sha256sum holad-*.tar.gz *.tar.gz *.apk *.exe *.msi *.AppImage *.deb *.zip 2>/dev/null > SHA256SUMS || true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            holad-web-release.tar.gz
            SHA256SUMS
            *.tar.gz
            *.apk
            *.exe
            *.msi
            *.AppImage
            *.deb
            *.zip
            *.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            holad-web-release.tar.gz
            *.tar.gz
            *.apk
            *.exe
            *.msi
            *.AppImage
            *.deb
            *.zip

      - name: Update Release Body
        if: ${{ steps.vt.outputs.analysis != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "" >> release-notes.md
          echo "### ![VirusTotal Scans](https://img.shields.io/badge/VirusTotal-Scans-blue?logo=virustotal&style=flat-square)" >> release-notes.md
          echo "" >> release-notes.md
          echo "| File | Report |" >> release-notes.md
          echo "|:---|:---|" >> release-notes.md
          IFS=',' read -ra ADDR <<< "$ANALYSIS"
          for i in "${ADDR[@]}"; do
            FILE="${i%%=*}"
            URL="${i#*=}"
            echo "| \`$FILE\` | [View Analysis]($URL) |" >> release-notes.md
          done
          gh release view "$TAG_NAME" -R "$REPO" --json body -q .body > current_body.md || echo "" > current_body.md
          cat release-notes.md >> current_body.md
          gh release edit "$TAG_NAME" -R "$REPO" --notes-file current_body.md
