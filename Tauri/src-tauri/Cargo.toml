[package]
name = "holad"
version = "2.0.0-localtest"
description = "Holad Music Player"
authors = ["FHRha"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Holad"

[[bin]]
name = "Holad"
path = "src/main.rs"

[lib]
name = "holad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
ureq = { version = "2.10", features = ["tls"] }
sha2 = "0.10"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-ogg", "symphonia-vorbis", "symphonia-isomp4", "symphonia-aac", "symphonia-wav", "symphonia-pcm"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "wav", "pcm"] }
rustfft = "6.2"
ringbuf = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.3", features = ["custom-protocol", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2.11.3", features = ["custom-protocol", "protocol-asset", "image-png"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
souvlaki = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry"
] }

[profile.release]
opt-level = 2
panic = "abort"
codegen-units = 16
lto = false
strip = true
incremental = true


